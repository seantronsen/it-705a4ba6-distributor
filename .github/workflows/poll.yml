# Polls the service repos, admits new releases, publishes their packages, records state, and prunes.
name: poll

on:
  # Config changes (a new repo, a deny) take effect right away.
  push:
    paths:
      - config/repos.yaml
  workflow_dispatch:

# Shared by every workflow that writes the target or state; a running one is never cancelled.
concurrency:
  group: poll
  cancel-in-progress: false

permissions: {}

jobs:
  # The commit whose state and config discover and admit read: the latest main, not the one the
  # run was queued on. A run that waited behind another would otherwise rediscover what that one
  # just recorded.
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve the latest commit
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)" >> "$GITHUB_OUTPUT"
      # A bad config fails the run here, before admit could reject releases over it.
      - name: Check out the config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false
      # pipx run needs nothing on PATH; the version comes from config/requirements.txt.
      - name: Validate the config
        run: |
          pipx run --spec "$(grep '^check-jsonschema==' config/requirements.txt)" check-jsonschema \
            --schemafile config/repos.schema.json config/repos.yaml

  # Fails the run on an archive key problem (expiring, or not keys/archive.asc) before anything is
  # published, and keeps the key issues in step.
  keys:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write     # archive key issues
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.config.outputs.sha }}
          fetch-depth: 0   # check-keys dates keys/archive-next.asc from its history
          persist-credentials: false
      - name: Check the archive key
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARCHIVE_GPG_KEY: ${{ secrets.ARCHIVE_GPG_KEY }}
          ARCHIVE_GPG_PASSPHRASE: ${{ secrets.ARCHIVE_GPG_PASSPHRASE }}
        run: PUBLISH_DIR=$RUNNER_TEMP/target scripts/check-keys.sh

  discover:
    needs: [config, keys]
    permissions:
      contents: read
    uses: ./.github/workflows/_discover.yml
    with:
      sha: ${{ needs.config.outputs.sha }}

  admit:
    needs: [config, discover]
    if: needs.discover.outputs.count != '0'
    permissions:
      contents: read
    uses: ./.github/workflows/_admit.yml
    with:
      matrix: ${{ needs.discover.outputs.matrix }}
      sha: ${{ needs.config.outputs.sha }}
    secrets:
      MASTER_PUBLIC_ASC: ${{ secrets.MASTER_PUBLIC_ASC }}
      MASTER_FPR: ${{ secrets.MASTER_FPR }}

  # Runs for whatever was admitted; a failed admit job is retried by the next poll.
  publish:
    needs: admit
    if: ${{ !cancelled() && needs.admit.result != 'skipped' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_publish.yml
    secrets:
      ARCHIVE_GPG_KEY: ${{ secrets.ARCHIVE_GPG_KEY }}
      ARCHIVE_GPG_PASSPHRASE: ${{ secrets.ARCHIVE_GPG_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  record:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: write   # commit state
      issues: write     # rejection issues
    uses: ./.github/workflows/_record.yml
    with:
      artifacts: poll-*

  # Every run, also with nothing new: a failed prune retries here.
  prune:
    needs: [discover, record]
    if: ${{ !cancelled() && needs.discover.result == 'success' && needs.record.result != 'failure' }}
    permissions:
      contents: write   # commit state
      issues: write     # denied-key and prune-failing issues
      actions: read     # previous prune runs
    uses: ./.github/workflows/_prune.yml
    secrets:
      ARCHIVE_GPG_KEY: ${{ secrets.ARCHIVE_GPG_KEY }}
      ARCHIVE_GPG_PASSPHRASE: ${{ secrets.ARCHIVE_GPG_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
