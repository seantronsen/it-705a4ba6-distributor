# Validates config/distributor.yaml and state/state.json against their schemas on every PR, so main
# only ever gets a valid config and state (make it a required status check). Poll validates the
# config again before reading it, and record the state before committing it.
#
# The one pull_request workflow: no secrets and read-only, so a PR can't reach anything. No paths
# filter, since a required check that doesn't run blocks the PR.
name: validate

on:
  pull_request:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the config
        run: scripts/validate.sh schemas/distributor.schema.json config/distributor.yaml
      - name: Validate the state
        run: scripts/validate.sh schemas/state.schema.json state/state.json
