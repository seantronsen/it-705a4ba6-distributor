# Applies a run's results to state and files issues. Reusable; the caller holds the poll
# concurrency group.
name: _record

on:
  workflow_call:
    inputs:
      artifacts:
        description: 'Glob of the artifacts holding result.json and delta files to apply'
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # commit state
      issues: write     # rejection and denied-key issues
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifacts }}
          path: ${{ runner.temp }}/record
      - name: Commit state
        run: |
          mapfile -t files < <(find "$RUNNER_TEMP/record" -name '*.json' | sort)
          scripts/commit-state.sh "${files[@]}"
      - name: Open issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find "$RUNNER_TEMP/record" -name '*.json' | sort)
          [[ ${#files[@]} -eq 0 ]] || scripts/record.sh issues "${files[@]}"
