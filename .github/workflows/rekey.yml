# Re-signs the published repositories with the current archive key after a key switch
# (spec-deferred.md, Rotation, step 4). Safe to rerun: it resumes from signed_with in state.
name: rekey

on:
  workflow_dispatch:

# Writes the target and state, like poll.
concurrency:
  group: poll
  cancel-in-progress: false

permissions: {}

jobs:
  rekey:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        format: [rpm, deb]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends createrepo-c apt-utils > /dev/null
      - name: Re-sign
        env:
          FORMAT: ${{ matrix.format }}
          ARCHIVE_GPG_KEY: ${{ secrets.ARCHIVE_GPG_KEY }}
          ARCHIVE_GPG_PASSPHRASE: ${{ secrets.ARCHIVE_GPG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: PUBLISH_DIR=$RUNNER_TEMP/target scripts/rekey.sh "$FORMAT" delta
      # Kept even when re-signing fails or times out: record commits the progress.
      - name: Upload delta
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rekey-delta-${{ matrix.format }}
          path: delta/rekey-${{ matrix.format }}.json
          if-no-files-found: ignore
          retention-days: 7

  record:
    needs: rekey
    if: ${{ !cancelled() }}
    permissions:
      contents: write   # commit state
      issues: write
    uses: ./.github/workflows/_record.yml
    with:
      artifacts: rekey-delta-*
