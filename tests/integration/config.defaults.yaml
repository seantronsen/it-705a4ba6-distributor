#
# tests/integration/config.defaults.yaml
#
# =============================================================================
# Distributor Integration Tests - Default Configuration
# =============================================================================
#
# DO NOT EDIT THIS FILE. It holds every setting the integration tests read,
# with its default value, and is part of the test code.
#
# To customize, create your own config file with only the keys you want to
# change, copied from here:
#
#   ~/.config/distributor-it/config.yaml   ($XDG_CONFIG_HOME is respected)
#
# The IT_CONFIG environment variable picks another file instead. Nothing writes
# to either file. Secrets never go in them: the GitHub token comes from gh, and
# git pushes through your SSH agent.
#
# Configuration precedence (highest first):
#   1. your config file
#   2. this file
#
# A key set in neither is an error, except where noted.

# -------------------------------------------------------------------------
# Repos
# -------------------------------------------------------------------------

# Each repo the suite uses, by role. Each role takes:
#
#   remote:   the throwaway GitHub repo (owner/name). It's overwritten
#             completely on every run: use repos made for this only. Set all
#             or none. Normally left unset: init.sh creates random ones and
#             records them in its state file
#             (~/.local/state/distributor-it/repos.yaml), and destroy.sh
#             deletes them. Set here, they're used instead, and init.sh and
#             destroy.sh leave them alone.
#   checkout: the code the repo is templated from: copied to a temporary
#             directory, then force-pushed to the remote with the suite's
#             changes. One of:
#               path: a local checkout. Its HEAD commit is used, and tracked
#                     files must be committed. Relative paths start at this
#                     repo's root. Git worktrees work.
#               repo: a GitHub repo (owner/name), fetched anonymously over
#                     HTTPS, with
#               ref:  a commit, tag, or branch (optional; default: its latest
#                     release).
#             A checkout in your config file replaces the whole checkout
#             here: setting path drops repo and ref, and the other way round.
#   packages: the packages the repo's releases carry, which the distributor's
#             config allows it.
repos:
  # The distributor.
  #
  # Default: this repo; remote unset
  distributor:
    checkout:
      path: .
    #remote: you/my-distributor

  # A service repo whose own release workflow builds real releases.
  #
  # Default: OpenCHAMI/github-actions-testbed at its latest release; remote
  #          unset
  service:
    checkout:
      repo: OpenCHAMI/github-actions-testbed
    packages: [testbed, testbed-quadlet]
    #remote: you/my-service

  # A service repo that only gets releases the suite crafts (no checkout). Its
  # remote's name must start with service's plus "-" (package-rules'
  # longer-name check needs it). Its entry stays even with nothing set, so
  # it's still one of the roles:
  #
  #   fixture:
  #     remote: you/my-service-tools
  #
  # Default: remote unset
  fixture: {}

# -------------------------------------------------------------------------
# Containers
# -------------------------------------------------------------------------

containers:
  # The container engine: podman or docker. The s3 tests need rootless podman
  # (their tools container gets its socket).
  #
  # Default: unset (rootless podman, else podman, else docker: the first
  #          installed)
  #engine: podman

  images:
    # The tools container both suites run in.
    #
    # Default: docker.io/library/debian:13
    tools: docker.io/library/debian:13

    # s3/cases/install.bats: the Fedora client (dnf installs).
    #
    # Default: docker.io/library/fedora:42
    fedora: docker.io/library/fedora:42

    # s3/cases/install.bats: the Debian client (apt installs).
    #
    # Default: docker.io/library/debian:13
    debian: docker.io/library/debian:13

# -------------------------------------------------------------------------
# Runs
# -------------------------------------------------------------------------

# Where run reports, settings, and exported artifacts go, one directory per
# run (<output_dir>/<run id>). Kept after the run.
#
# Default: /tmp/distributor-it
output_dir: /tmp/distributor-it

wait:
  # Longest any single wait on GitHub may take, in seconds.
  #
  # Default: 3600
  timeout: 3600

  # Pause between checks while waiting on GitHub, in seconds.
  #
  # Default: 10
  interval: 10

# Leave the GitHub repos as the run's last test left them (no end-of-run
# cleanup), for inspection. Every test still resets them before it starts.
#
# Default: false
keep_repos: false

# -------------------------------------------------------------------------
# Keys
# -------------------------------------------------------------------------

keys:
  # Algorithm of the root, repo, and crafted release signing keys (as gpg
  # --quick-generate-key takes it).
  #
  # Default: ed25519
  algorithm_attestation: ed25519

  # Algorithm of the archive key, which signs the published repositories.
  #
  # Default: rsa3072
  algorithm_archive: rsa3072

# -------------------------------------------------------------------------
# S3
# -------------------------------------------------------------------------

s3:
  # The AWS test bucket every test publishes to (target.s3 in the
  # distributor's config).
  #
  # Its name, region, and public base URL. Normally left unset:
  # s3/init-aws.sh creates one and records it in its state file
  # (~/.local/state/distributor-it/s3.json), and s3/destroy-aws.sh deletes it.
  # Set here, they're used instead (with credentials in AWS_ACCESS_KEY_ID and
  # AWS_SECRET_ACCESS_KEY).
  #
  # Default: unset (the state file's)
  #bucket: my-bucket
  #region: us-east-1
  #url: https://my-bucket.s3.us-east-1.amazonaws.com

  # The metadata-max-age the tests give the distributor's target, in seconds.
  #
  # Default: 60
  metadata_max_age: 60
