# Integration test settings, for ci/ and distro/. Copy to config.yaml (gitignored), or point
# IT_CONFIG at another file. Nothing writes to it. Secrets never go here: the GitHub token comes
# from gh, git uses your SSH agent.

# Local checkouts whose HEAD commits get tested (force-pushed to the throwaway repos). Tracked
# files must be committed. Git worktrees work.
checkouts:
  distributor: ~/projects/openchami/distributor
  testbed: ~/projects/openchami/github-actions-testbed

# The throwaway repos. Normally left out: init.sh creates random ones and records them in its
# state file (~/.local/state/distributor-it/repos.yaml). Set here, they're used instead, and
# init.sh and destroy.sh leave them alone. The second service repo's name should start with the
# testbed's plus "-" (package-rules' longer-name check needs it).
#repos:
#  distributor: you/my-distributor
#  testbed: you/my-testbed
#  service2: you/my-testbed-tools

images:
  # The tools container both suites run in.
  tools: docker.io/library/debian:13
  # distro: the targets, and the S3 gateway.
  fedora: docker.io/library/fedora:42
  debian: docker.io/library/debian:13
  versitygw: docker.io/versity/versitygw:v1.10.0

# podman or docker; empty picks podman when installed. distro needs rootless podman.
engine: ""

# Where run reports and exported artifacts go (one directory per run).
output_dir: /tmp/distributor-it

# Seconds any single wait may take, and between checks while waiting.
timeout: 3600
poll_interval: 10

# true leaves the repos as the run left them (no end-of-run cleanup), for inspection.
keep: false
